<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Header Craft</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            width: 420px;
            background-color: #d5e8f3;
        }

        h1 {
            color: #3498db;
            text-align: left;
            padding: 3px 7px 0;
            margin: 0 0 3px;
        }

        .wrapper {
            display: flex;
            width: 100%;
        }

        aside {
            width: 34.5px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .sidebar-btn {
            box-sizing: border-box;
            width: 34.5px;
            height: 34.5px;
            background-color: #c5d8e3;
            border: 1px solid #bccdd6;
            border-top: none;
            border-left: none;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            margin: 0;
        }

        .sidebar-btn.add {
            background-color: #e4f0f9;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            margin: 2.5px 0 0 2.5px;
        }

        .sidebar-btn.add:hover {
            background-color: #d5e8f3;
        }

        input[type="radio"] {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
        }

        input[type="radio"]:checked + .sidebar-btn {
            background-color: #d5e8f3;
            border-right: none;
        }

        input[type="radio"] + .sidebar-btn:hover {
            background-color: #3498db;
        }

        input[type="radio"]:focus-visible + .sidebar-btn {
            outline: 2px solid #000;
            outline-offset: -2px;
        }

        #headers {
            flex-grow: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border-bottom: 1px solid #bdc3c7;
        }

        td {
            padding: 3px;
            text-align: left;
            border-bottom: 1px solid #bdc3c7;
        }

        th {
            padding: 4px;
            background-color: #3498db;
            color: #fff;
            text-align: left;
            border-bottom: 1px solid #bdc3c7;
        }

        td:first-child {
            padding-right: 0;
        }

        input[type="text"] {
            padding: 4px;
            width: calc(100% - 14px);
        }

        .comment {
            max-width: 100px;
        }

        .footer {
            padding: 2px 10px 4px;
            text-align: end;
        }

        .footer button {
            background: none;
            border: none;
            color: blue;
            text-decoration: underline;
            cursor: pointer;
            padding: 0;
            font: inherit;
            font-size: larger;
        }

        #status {
            min-height: 1em;
            margin: 0;
            padding: 0 10px 4px;
            color: #b00020;
        }

        .privacy-note {
            margin: 0;
            padding: 2px 7px 7px;
            font-size: 13px;
            line-height: 1.3;
            color: #34495e;
        }
    </style>
</head>

<body>
    <h1>
        Header Craft
    </h1>
    <p class="privacy-note">
        Chrome Sync stores profile and header values. Enabling a row adds its header name and value to requests from this tab, including third-party subresources. Never enter passwords, cookies, API keys, or tokens.
        <a href="https://github.com/vivcogit/header-craft/blob/main/policy.md" target="_blank" rel="noreferrer">Privacy</a>
    </p>

    <div class="wrapper">
        <aside id="aside">
            <!-- <button class="sidebar-btn add">+</button> -->
        </aside>

        <div id="headers">
            <table id="headersTable">
                <thead>
                    <tr>
                        <th scope="col">On</th>
                        <th scope="col">Comment</th>
                        <th scope="col">Name</th>
                        <th scope="col">Value</th>
                    </tr>
                </thead>
                <tbody id="headersTableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="footer">
        <button id="export" type="button">export</button>
        /
        <button id="import" type="button">import</button>
    </div>

    <p id="status" role="status" aria-live="polite"></p>
    <script src="popup.js" type="module"></script>
</body>

</html>
